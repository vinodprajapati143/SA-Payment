            <div
  class="flex justify-between bg-white border-b border-gray-100 items-center fixed top-0 w-full h-16 z-50 px-4 md:px-8 shadow-sm">
  <!-- Left Side Logo -->
  <div class="flex items-center">
    <span (click)="goToHome()" class="cursor-pointer flex items-center gap-2">
      <img *ngIf="siteLogo" [src]="siteLogo" alt="logo" class="h-8 max-w-[150px] object-contain">
      <span *ngIf="!siteLogo" class="text-xl font-extrabold text-[#0e263e] tracking-tight">Sapayment Pay</span>
    </span>
  </div>

  <!-- Center Desktop Navigation Links -->
  <nav class="hidden lg:flex items-center gap-6 text-sm font-semibold text-gray-600">
    <a routerLink="/" routerLinkActive="text-[#0d6efd] font-bold" [routerLinkActiveOptions]="{exact: true}"
      class="hover:text-[#0d6efd] transition-colors">Home</a>
    <a routerLink="/user/about-us" routerLinkActive="text-[#0d6efd] font-bold"
      class="hover:text-[#0d6efd] transition-colors">About</a>
    <!-- <a href="#merchant-payment" class="hover:text-[#0d6efd] transition-colors">Solutions</a>
    <a href="#upiflow" class="hover:text-[#0d6efd] transition-colors">UPIFlow</a> -->
    <a routerLink="/user/blogs" routerLinkActive="text-[#0d6efd] font-bold"
      class="hover:text-[#0d6efd] transition-colors">Blog</a>
    <a routerLink="/user/contact" routerLinkActive="text-[#0d6efd] font-bold"
      class="hover:text-[#0d6efd] transition-colors">Contact</a>
  </nav>

  <!-- Right Side Action Button -->
  <div class="flex items-center">
    <button routerLink="/user/home"
      class="bg-[#0e263e] text-white hover:bg-[#06182a] font-bold px-5 py-2.5 rounded-full text-xs transition-all flex items-center justify-center gap-1.5 shadow-md">
      Get Started
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"
        class="w-4 h-4">
        <path stroke-linecap="round" stroke-linejoin="round" d="M13.5 4.5L21 12m0 0l-7.5 7.5M21 12H3" />
      </svg>
    </button>
  </div>
</div>
